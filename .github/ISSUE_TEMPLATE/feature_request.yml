name: Feature request
description: An idea for a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: You can write in English or Russian.
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
      description: Describe the HR or recruiter scenario and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
