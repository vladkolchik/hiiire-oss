name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here; see SECURITY.md.
        Do not attach real candidate personal data, tokens or `.env` contents.
        You can write in English or Russian.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Briefly describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /dashboard/candidates
        2. Click "Добавить кандидата" (Add candidate)
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      options:
        - hiiire.com
        - Self-hosted installation
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: For self-hosted installations and local development, the commit hash.
  - type: textarea
    id: env
    attributes:
      label: Environment and logs
      description: Browser and device, console or Network errors (without secrets), screenshots.
