<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telegram webhook</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101820;
        color: #edf2f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      main {
        width: min(100%, 680px);
        border: 1px solid #314255;
        border-radius: 8px;
        background: #172331;
        padding: 28px;
        box-shadow: 0 18px 60px rgb(0 0 0 / 0.28);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 18px;
        color: #b7c4d3;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #d8e3ef;
        font-size: 14px;
      }

      input,
      select,
      button {
        width: 100%;
        border-radius: 6px;
        border: 1px solid #3b5168;
        background: #0f1822;
        color: #f8fafc;
        min-height: 42px;
        padding: 10px 12px;
        font: inherit;
      }

      button {
        border: 0;
        background: #4f7cff;
        cursor: pointer;
        font-weight: 700;
      }

      button:hover {
        background: #638bff;
      }

      .hint {
        margin-top: 16px;
        font-size: 13px;
        color: #9fb0c2;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      @media (max-width: 640px) {
        main {
          padding: 22px;
        }

        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Telegram webhook</h1>
      <p>
        Локальная форма для регистрации webhook. Данные не сохраняются в браузере; запрос откроет ответ Telegram в новой
        вкладке.
      </p>

      <form id="webhook-form" target="_blank" method="post">
        <label>
          Bot token
          <input id="token" name="token" type="password" autocomplete="off" required />
        </label>

        <label>
          Webhook URL
          <input
            id="webhook-url"
            name="url"
            type="url"
            value="https://tg.hiiire.com/api/telegram/webhook"
            required
          />
        </label>

        <label>
          Webhook secret
          <input id="secret" name="secret_token" type="password" autocomplete="off" />
        </label>

        <div class="row">
          <label>
            Действие
            <select id="action" name="action">
              <option value="setWebhook">setWebhook</option>
              <option value="getWebhookInfo">getWebhookInfo</option>
              <option value="deleteWebhook">deleteWebhook</option>
            </select>
          </label>

          <label>
            allowed_updates
            <input id="allowed-updates" name="allowed_updates" value='["message"]' />
          </label>
        </div>

        <button type="submit">Выполнить</button>
      </form>

      <p class="hint">
        Для setWebhook нужен token, URL и secret. Для getWebhookInfo/deleteWebhook достаточно token. В РФ запрос к
        api.telegram.org может не пройти.
      </p>
    </main>

    <script>
      const form = document.querySelector("#webhook-form");
      const action = document.querySelector("#action");
      const token = document.querySelector("#token");
      const secret = document.querySelector("#secret");
      const url = document.querySelector("#webhook-url");
      const allowedUpdates = document.querySelector("#allowed-updates");

      function removeGeneratedFields() {
        form.querySelectorAll("[data-generated='true']").forEach((field) => field.remove());
      }

      function addHiddenField(name, value) {
        const field = document.createElement("input");
        field.type = "hidden";
        field.name = name;
        field.value = value;
        field.dataset.generated = "true";
        form.appendChild(field);
      }

      form.addEventListener("submit", (event) => {
        const method = action.value;
        const botToken = token.value.trim();
        if (!botToken) {
          event.preventDefault();
          token.focus();
          return;
        }
        if (method === "setWebhook" && !secret.value.trim()) {
          event.preventDefault();
          secret.focus();
          return;
        }

        removeGeneratedFields();
        form.action = `https://api.telegram.org/bot${botToken}/${method}`;

        token.disabled = true;
        action.disabled = true;
        url.disabled = true;
        secret.disabled = true;
        allowedUpdates.disabled = true;

        if (method === "setWebhook") {
          addHiddenField("url", url.value.trim());
          addHiddenField("secret_token", secret.value.trim());
          addHiddenField("allowed_updates", allowedUpdates.value.trim() || '["message"]');
        }

        window.setTimeout(() => {
          token.disabled = false;
          action.disabled = false;
          url.disabled = false;
          secret.disabled = false;
          allowedUpdates.disabled = false;
          removeGeneratedFields();
        }, 0);
      });
    </script>
  </body>
</html>
